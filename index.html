  <script>
    // ========================================================
    // KUNCI SUPABASE ANDA
    // ========================================================
    const SUPABASE_URL = 'https://lzudrzpcahjyeqdvkyto.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dWRyenBjYWhqeWVxZHZreXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDYyODcsImV4cCI6MjEwNzgyMjI4N30.nI_84CyPRp-sv6_VJvpUB1bk7XWN0NCtSotwztl_lEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const cardCodeParam = urlParams.get('code');

    let modalCallback = null;

    // Helper untuk memastikan URL selalu menggunakan protocol https://
    function formatUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        return 'https://' + cleanUrl;
      }
      return cleanUrl;
    }

    // FUNGSI SALIN LINK KE CLIPBOARD
    function copyPageLink() {
      const currentUrl = window.location.href;
      navigator.clipboard.writeText(currentUrl).then(() => {
        showNotification('Berhasil Disalin!', 'Link halaman ini telah disalin ke clipboard. Simpan link ini agar Anda bisa mengedit info kartu kapan saja.', 'success');
      }).catch(err => {
        showNotification('Gagal Menyalin', 'Tidak dapat menyalin tautan secara otomatis.', 'error');
      });
    }

    // FUNGSI NOTIFIKASI KUSTOM
    function showNotification(title, message, type = 'info', onConfirm = null) {
      const modal = document.getElementById('custom-modal');
      const iconEl = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      titleEl.innerText = title;
      msgEl.innerText = message;
      modalCallback = onConfirm;

      if (type === 'success') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-green-100 text-green-600';
        iconEl.innerText = '✓';
      } else if (type === 'error') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-red-100 text-red-600';
        iconEl.innerText = '✕';
      } else {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-blue-100 text-blue-600';
        iconEl.innerText = 'ℹ';
      }

      modal.classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('custom-modal').classList.add('hidden');
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    // INISIALISASI APLIKASI
    async function initApp() {
      if (cardCodeParam) {
        const cleanCode = cardCodeParam.trim().toUpperCase();

        const { data: card, error } = await supabaseClient
          .from('cards')
          .select('*')
          .eq('card_code', cleanCode)
          .maybeSingle();

        if (error) {
          showNotification('Kendala Sistem', 'Gagal terhubung ke database. Silakan coba beberapa saat lagi.', 'error', () => renderHome());
          return;
        }

        if (card) {
          if (card.is_activated) {
            renderActiveCardStatus(card);
            return;
          } else {
            renderActivationForm(card.card_code);
            return;
          }
        } else {
          showNotification('Kartu Tidak Ditemukan', `Kode kartu "${cleanCode}" belum terdaftar di sistem.`, 'error', () => renderHome());
          return;
        }
      }
      
      renderHome();
    }

      document.getElementById('app-content').innerHTML = `

        </p>

        <button onclick="handleCheckCard()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-4 hover:bg-blue-700 transition">Lanjut →</button>
        
        <div class="relative flex py-2 items-center mb-4">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-xs text-gray-400">atau</span>
