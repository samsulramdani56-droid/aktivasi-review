<!DOCTYPE html>
<html lang="id">
<head>

  <style>

      to { opacity: 1; transform: scale(1); }

<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

  <!-- Header Website -->
  <header class="w-full max-w-md flex justify-between items-center py-4">
    <div class="flex items-center gap-2">
      <div class="bg-red-700 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center">R</div>
      <span class="font-bold text-gray-800 text-lg">Aktivasi Review</span>
      <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">v4.2</span>
    </div>
    <div class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full flex gap-2">

  <!-- Konten Utama -->
  <main id="app-content" class="w-full max-w-md bg-white rounded-3xl p-6 shadow-sm border border-gray-100">

  </main>

  <footer class="mt-8 text-center text-xs text-gray-400">

  <!-- MODAL NOTIFIKASI KUSTOM -->
  <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl text-center animate-modal">
      <div id="modal-icon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3"></div>
      <h3 id="modal-title" class="font-bold text-gray-900 text-lg mb-1">Pemberitahuan</h3>
      <p id="modal-message" class="text-sm text-gray-600 mb-6 leading-relaxed"></p>
      <button id="modal-btn" onclick="closeCustomModal()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">
        Mengerti
      </button>
    </div>
  </div>

  <script>
    // ========================================================
    // KUNCI SUPABASE ANDA
    // ========================================================
    const SUPABASE_URL = 'https://lzudrzpcahjyeqdvkyto.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dWRyenBjYWhqeWVxZHZreXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDYyODcsImV4cCI6MjEwNzgyMjI4N30.nI_84CyPRp-sv6_VJvpUB1bk7XWN0NCtSotwztl_lEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const cardCodeParam = urlParams.get('code');

    let modalCallback = null;

    // Helper untuk memastikan URL selalu menggunakan protocol https://
    function formatUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        return 'https://' + cleanUrl;
      }
      return cleanUrl;
    }

    // FUNGSI NOTIFIKASI KUSTOM
    function showNotification(title, message, type = 'info', onConfirm = null) {
      const modal = document.getElementById('custom-modal');
      const iconEl = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      titleEl.innerText = title;
      msgEl.innerText = message;
      modalCallback = onConfirm;

      if (type === 'success') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-green-100 text-green-600';
        iconEl.innerText = '✓';
      } else if (type === 'error') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-red-100 text-red-600';
        iconEl.innerText = '✕';
      } else {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-blue-100 text-blue-600';
        iconEl.innerText = 'ℹ';
      }

      modal.classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('custom-modal').classList.add('hidden');
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    // INISIALISASI APLIKASI
    async function initApp() {
      if (cardCodeParam) {
        const cleanCode = cardCodeParam.trim().toUpperCase();

        const { data: card, error } = await supabaseClient
          .from('cards')
          .select('*')
          .eq('card_code', cleanCode)
          .maybeSingle();

        if (error) {
