    // FUNGSI PINTAR: Mengekstrak Place ID jika ada, atau mengonversi link/nama bisnis ke link review Google langsung
    function generateReviewUrl(inputUrl, businessName) {
      if (!inputUrl) return '';
      let clean = inputUrl.trim();

      // Jika sudah berupa link direct review Google, langsung gunakan
      if (clean.includes('search.google.com') || clean.includes('writereview')) {
        return clean;
      }

      // Deteksi jika link memiliki parameter Place ID (placeid / ftid)
      const placeIdMatch = clean.match(/(?:placeid=|ftid=)(ChI[a-zA-Z0-9_-]+)/);
      if (placeIdMatch && placeIdMatch[1]) {
        return `https://search.google.com/local/writereview?placeid=${placeIdMatch[1]}`;
      }

      // Jika tidak ada Place ID eksplisit, gunakan query nama bisnis + keyword review untuk membuka ulasan langsung
      const queryText = businessName ? `${businessName} review` : clean;
      return `https://www.google.com/search?q=${encodeURIComponent(queryText)}`;
    }

    function formatUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        return 'https://' + cleanUrl;
      }
      return cleanUrl;
    }

      const modal = document.getElementById('custom-modal');
      const iconEl = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      titleEl.innerText = title;
      msgEl.innerText = message;

        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-green-100 text-green-600';
        iconEl.innerText = '✓';
      } else if (type === 'error') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-red-100 text-red-600';
        iconEl.innerText = '✕';
      } else {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-blue-100 text-blue-600';
        iconEl.innerText = 'ℹ';
      }

      modal.classList.remove('hidden');
    }

        const { data: card, error } = await supabaseClient

          .select('*')

          showNotification('System Error', 'Gagal memuat data.', 'error', () => window.renderHome());

        if (card) {

            // JIKA DIBUKA LEWAT SCAN NFC/QR LANGSUNG -> REDIRECT KE GOOGLE REVIEW!

              return;
            }
            renderActiveCardStatus(card);
            return;
          } else {
            renderActivationForm(card.card_code);
            return;
          }
        } else {
          renderActivationForm(cleanCode);
          return;
        }
      }
      
      window.renderHome();
    }

    window.handleCheckCard = async function() {
      const code = document.getElementById('cardInput').value.trim().toUpperCase();
      if (!code) {
        showNotification('Notice', currentLang === 'en' ? 'Please enter card code.' : 'Masukkan kode kartu.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .maybeSingle();

      if (error) {
        showNotification('Error', 'Database error.', 'error');
        return;
      }

      if (card) {
        if (card.is_activated) { 
          renderActiveCardStatus(card); 
        } else { 
          renderActivationForm(card.card_code); 
        }
      } else {
        showNotification(
          currentLang === 'en' ? 'Card Not Found' : 'Kartu Tidak Ditemukan', 
          currentLang === 'en' ? `Code "${code}" is not registered in the system.` : `Kode kartu "${code}" tidak terdaftar di sistem. Pastikan kode benar atau gunakan scan QR/NFC pada kartu fisik.`, 
          'error'
        );
      }
    }

    window.submitActivation = async function(code) {
      const name = document.getElementById('bizName').value.trim();
      const rawUrl = document.getElementById('bizUrl').value.trim();
      const pin = document.getElementById('bizPin').value.trim();

      if (!name || !rawUrl || pin.length !== 4) {
        showNotification('Notice', currentLang === 'en' ? 'Complete all fields & 4-digit PIN.' : 'Lengkapi data & PIN 4 digit.', 'info');
        return;
      }

      const generatedReviewUrl = generateReviewUrl(rawUrl, name);

      const { error } = await supabaseClient
        .from('cards')
        .upsert({ 
          card_code: code,
          business_name: name, 
          google_review_url: generatedReviewUrl, 
          pin: pin, 
          is_activated: true 
        }, { onConflict: 'card_code' });

      if (!error) {
        showNotification('Success!', currentLang === 'en' ? 'Card activated.' : 'Kartu berhasil diaktifkan.', 'success', () => {
          window.renderActiveCardStatusByCode(code);
        });
      } else {
        showNotification('Error', error.message, 'error');
      }
    }

    window.handleManageLogin = async function() {
      const code = document.getElementById('manageCode').value.trim().toUpperCase();
      const pin = document.getElementById('managePin').value.trim();

      if (!code || !pin) {
        showNotification('Notice', currentLang === 'en' ? 'Enter code & PIN.' : 'Masukkan kode & PIN.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .eq('pin', pin)
        .maybeSingle();

      if (card) { renderEditForm(card); } 
      else { showNotification('Access Denied', currentLang === 'en' ? 'Wrong Code or PIN.' : 'Kode atau PIN salah!', 'error'); }
    }

    function renderEditForm(card) {
      const t = translations[currentLang];
      document.getElementById('app-content').innerHTML = `
        <h1 class="text-2xl font-bold text-gray-900 mb-2">${t.editInfoTitle}</h1>
        <p class="text-gray-500 text-xs mb-6">${t.editInfoDesc(card.card_code)}</p>

        <label class="block text-xs font-semibold text-gray-700 mb-1">${t.bizNameLabel}</label>
        <input id="editName" type="text" value="${card.business_name || ''}" class="w-full border rounded-xl p-3 mb-4 text-sm">

        <label class="block text-xs font-semibold text-gray-700 mb-1">${t.bizUrlLabel}</label>
        <input id="editUrl" type="text" value="${card.google_review_url || ''}" class="w-full border rounded-xl p-3 mb-1 text-sm">
        <p class="text-[11px] text-gray-400 mb-4 leading-normal">${t.bizUrlHelp}</p>

        <label class="block text-xs font-semibold text-gray-700 mb-1">${t.newPinLabel}</label>
        <input id="editPin" type="password" maxlength="4" placeholder="****" class="w-full border rounded-xl p-3 mb-6 text-sm">

        <button onclick="window.submitEdit('${card.card_code}', '${card.pin}')" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-3 hover:bg-blue-700 transition">${t.saveChangesBtn}</button>
        <button onclick="window.renderActiveCardStatusByCode('${card.card_code}')" class="w-full text-gray-600 text-sm py-2">${t.cancelBtn}</button>
      `;
    }

    // Setelah simpan perubahan, kembalikan ke Halaman Status Kartu Ringkasan
    window.submitEdit = async function(cardCode, currentPin) {
      const name = document.getElementById('editName').value.trim();
      const rawUrl = document.getElementById('editUrl').value.trim();
      const newPin = document.getElementById('editPin').value.trim();

      if (!name || !rawUrl) {
        showNotification('Notice', 'Required fields.', 'info');
        return;
      }

      let finalPin = currentPin;
      if (newPin) {
        if (newPin.length !== 4) { showNotification('Notice', 'PIN must be 4 digits.', 'info'); return; }
        finalPin = newPin;
      }

      const generatedReviewUrl = generateReviewUrl(rawUrl, name);
      const { error } = await supabaseClient
        .from('cards')
        .update({ business_name: name, google_review_url: generatedReviewUrl, pin: finalPin })
        .eq('card_code', cardCode);

      if (!error) {
        showNotification('Success', currentLang === 'en' ? 'Data updated successfully.' : 'Data berhasil diperbarui.', 'success', () => {
          window.renderActiveCardStatusByCode(cardCode);
        });
      } else {
        showNotification('Error', error.message, 'error');
      }
    }

    window.renderActiveCardStatusByCode = async function(code) {
      const { data: card } = await supabaseClient.from('cards').select('*').eq('card_code', code).maybeSingle();
      if (card) { renderActiveCardStatus(card); } else { window.renderHome(); }
    }

    initApp();
  </script>
</body>
</html>
