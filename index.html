    window.setLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      
      const btnId = document.getElementById('btn-id');
      const btnEn = document.getElementById('btn-en');

      if (lang === 'en') {
        btnEn.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-sm";
        btnId.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900";
      } else {
        btnId.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-sm";
        btnEn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900";
      }

      initApp();
    }

    const SUPABASE_URL = 'https://lzudrzpcahjyeqdvkyto.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dWRyenBjYWhqeWVxZHZreXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDYyODcsImV4cCI6MjEwNzgyMjI4N30.nI_84CyPRp-sv6_VJvpUB1bk7XWN0NCtSotwztl_lEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const cardCodeParam = urlParams.get('code');

    let modalCallback = null;
    let html5QrCode = null;
    let selectedRating = 0;

    // FUNGSI PINTAR UNTUK MENGUBAH PLACE ID / LINK MENJADI DIRECT REVIEW LINK
    function formatReviewUrl(input) {
      if (!input) return '';
      let clean = input.trim();

      // Jika input hanya berupa Place ID saja (contoh: ChIJXanaDyrDaC4RTkdVD1FTIyc)
      if (clean.startsWith('ChI') && !clean.includes('http') && !clean.includes(' ')) {
        return `https://search.google.com/local/writereview?placeid=${clean}`;
      }

      // Jika berupa URL biasa yang belum ada https://
      if (!clean.startsWith('http://') && !clean.startsWith('https://')) {
        return 'https://' + clean;
      }

      return clean;
    }

    // FUNGSI SCANNER QR KAMERA
    window.startQrScanner = function() {
      const modal = document.getElementById('qr-reader-modal');
      modal.classList.remove('hidden');

      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      
      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          stopQrScanner();
          try {
            const urlObj = new URL(decodedText);
            const scannedCode = urlObj.searchParams.get('code');
            if (scannedCode) {
              document.getElementById('cardInput').value = scannedCode;
              window.handleCheckCard();
            } else {
              showNotification('Format Salah', 'QR Code ini tidak memiliki parameter kode kartu yang valid.', 'error');
            }
          } catch (e) {
            document.getElementById('cardInput').value = decodedText.trim();
            window.handleCheckCard();
          }
        },
        (errorMessage) => {
          // Frame error diabaikan saat scanning berjalan
        }
      ).catch((err) => {
        showNotification('Akses Kamera Ditolak', 'Pastikan Anda memberikan izin akses kamera pada browser.', 'error');
        closeQrScanner();
      });
    };

    window.closeQrScanner = function() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('qr-reader-modal').classList.add('hidden');
        }).catch(err => {
          document.getElementById('qr-reader-modal').classList.add('hidden');
        });
      } else {
        document.getElementById('qr-reader-modal').classList.add('hidden');
      }
    };

    function stopQrScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('qr-reader-modal').classList.add('hidden');
        }).catch(err => {
          document.getElementById('qr-reader-modal').classList.add('hidden');
        });
      }
    }

    window.copyPageLink = function() {
      const currentUrl = window.location.href;
      navigator.clipboard.writeText(currentUrl).then(() => {
        showNotification(
          currentLang === 'en' ? 'Copied Successfully!' : 'Berhasil Disalin!', 
          currentLang === 'en' ? 'Page link copied to clipboard.' : 'Link halaman ini telah disalin.', 
          'success'
        );
      });
    }

    function showNotification(title, message, type = 'info', onConfirm = null) {
      const modal = document.getElementById('custom-modal');
      const iconEl = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      titleEl.innerText = title;
      msgEl.innerText = message;
      modalCallback = onConfirm;

      if (type === 'success') {
        iconEl.className = 'w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 bg-emerald-50 text-emerald-600 shadow-inner';
        iconEl.innerText = '✓';
      } else if (type === 'error') {
        iconEl.className = 'w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 bg-rose-50 text-rose-600 shadow-inner';
        iconEl.innerText = '✕';
      } else {
        iconEl.className = 'w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 bg-blue-50 text-blue-600 shadow-inner';
        iconEl.innerText = 'ℹ';
      }

      modal.classList.remove('hidden');
    }

    window.closeCustomModal = function() {
      document.getElementById('custom-modal').classList.add('hidden');
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    async function initApp() {
      const btnId = document.getElementById('btn-id');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'en') {
        btnEn.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-sm";
        btnId.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900";
      } else {
        btnId.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-sm";
        btnEn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900";
      }

      const footerEl = document.querySelector('[data-i18n="footerText"]');
      if (footerEl) footerEl.innerText = translations[currentLang].footerText;

      if (cardCodeParam) {
        const cleanCode = cardCodeParam.trim().toUpperCase();

        const { data: card, error } = await supabaseClient
          .from('cards')
          .select('*')
          .eq('card_code', cleanCode)
          .maybeSingle();

        if (error) {
          showNotification('System Error', 'Gagal memuat data.', 'error', () => window.renderHome());
          return;
        }

        if (card) {
          if (card.is_activated) {
            // JIKA ROUTING AKTIF, TAMPILKAN HALAMAN SMART RATING
            if (card.enable_routing !== false) {
              renderSmartRatingPage(card);
              return;
            }

            // JIKA ROUTING NONAKTIF, REDIRECT LANGSUNG KE GOOGLE REVIEW
            const reviewUrl = formatReviewUrl(card.google_review_url);
            if (reviewUrl) {
              window.location.href = reviewUrl;
              return;
            }
            renderActiveCardStatus(card);
            return;
          } else {
            renderActivationForm(card.card_code);
            return;
          }
        } else {
          renderActivationForm(cleanCode);
          return;
        }
      }
      
      window.renderHome();
    }

    // ========================================================
    // FITUR SMART REVIEW ROUTING (BINTANG 1-5 INTERAKTIF)
    // ========================================================
    function renderSmartRatingPage(card) {
      selectedRating = 0;
      document.getElementById('app-content').innerHTML = `
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-inner">⭐</div>
          <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${card.business_name || 'Ulasan Pelanggan'}</h1>
          <p class="text-slate-500 text-xs leading-relaxed">Bagaimana pengalaman Anda bersama kami? Berikan penilaian terbaik Anda!</p>
        </div>

        <!-- Bintang Rating Interaktif -->
        <div class="flex justify-center items-center gap-2 mb-6" id="starContainer">
          ${[1, 2, 3, 4, 5].map(star => `
            <button onclick="handleSelectStar(${star}, '${card.card_code}', '${encodeURIComponent(card.google_review_url || '')}')" class="star-btn text-3xl sm:text-4xl text-slate-300 hover:scale-110 transition-all focus:outline-none">
              ★
            </button>
          `).join('')}
        </div>

        <!-- Form Feedback Khusus Bintang 1-3 (Hidden Default) -->
        <div id="feedbackFormContainer" class="hidden space-y-4 pt-4 border-t border-slate-100 animate-modal">
          <p class="text-xs font-bold text-amber-700 bg-amber-50 p-3 rounded-2xl border border-amber-100 text-center">
            Mohon maaf atas ketidaknyamanan Anda. Masukan Anda sangat berharga bagi kami.
          </p>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Anda (Opsional)</label>
            <input id="feedbackName" type="text" placeholder="Contoh: Budi" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">No. WhatsApp / HP (Opsional)</label>
            <input id="feedbackPhone" type="tel" placeholder="08123456789" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Kritik & Saran <span class="text-rose-500">*</span></label>
            <textarea id="feedbackText" rows="3" placeholder="Tuliskan keluhan atau saran Anda di sini..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all"></textarea>
          </div>

          <button onclick="submitPrivateFeedback('${card.card_code}', '${card.business_name || ''}')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">
            Kirim Masukan Privat
          </button>
        </div>
      `;
    }

    window.handleSelectStar = function(starCount, cardCode, encodedReviewUrl) {
      selectedRating = starCount;
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach((s, idx) => {
        if (idx < starCount) {
          s.classList.remove('text-slate-300');
          s.classList.add('text-amber-400');
        } else {
          s.classList.remove('text-amber-400');
          s.classList.add('text-slate-300');
        }
      });

      if (starCount >= 4) {
        // BINTANG 4 & 5: LANGSUNG DIARAHKAN KE GOOGLE REVIEW
        const reviewUrl = formatReviewUrl(decodeURIComponent(encodedReviewUrl));
        if (reviewUrl) {
          window.location.href = reviewUrl;
        } else {
          showNotification('Informasi', 'Link Google Review belum dikonfigurasi.', 'info');
        }
      } else {
        // BINTANG 1, 2, 3: TAMPILKAN FORM KRITIK/SARAN INTERNAL
        const formContainer = document.getElementById('feedbackFormContainer');
        if (formContainer) formContainer.classList.remove('hidden');
      }
    }

    window.submitPrivateFeedback = async function(cardCode, businessName) {
      const name = document.getElementById('feedbackName').value.trim();
      const phone = document.getElementById('feedbackPhone').value.trim();
      const text = document.getElementById('feedbackText').value.trim();

      if (!text) {
        showNotification('Mohon Isi Saran', 'Silakan tuliskan kritik atau saran Anda terlebih dahulu.', 'info');
        return;
      }

      // SIMPAN KRITIK/SARAN KE TABEL SUPABASE
      const { error } = await supabaseClient
        .from('review_feedbacks')
        .insert({
          card_code: cardCode,
          business_name: businessName,
          rating: selectedRating,
          customer_name: name || 'Anonim',
          customer_phone: phone || '-',
          feedback_message: text
        });

      if (!error) {
        // FORMAT PESAN AUTOMATIS KE WHATSAPP OWNER BISNIS
        const waMessage = encodeURIComponent(
          `📩 *Laporan Feedback Baru (${businessName || cardCode})*\n\n` +
          `⭐ Rating: ${selectedRating} Bintang\n` +
          `👤 Nama: ${name || 'Anonim'}\n` +
          `📞 No HP: ${phone || '-'}\n` +
          `💬 Pesan:\n"${text}"`
        );
        const waOwnerUrl = `https://wa.me/${OWNER_WHATSAPP}?text=${waMessage}`;

        showNotification(
          'Terima Kasih!', 
          'Masukan Anda telah berhasil terkirim secara langsung kepada pihak manajemen toko.', 
          'success',
          () => { window.location.href = waOwnerUrl; }
        );
      } else {
        showNotification('Gagal Mengirim', 'Terjadi kesalahan sistem, silakan coba lagi.', 'error');
      }
    }

    // 1. BERANDA
    window.renderHome = function() {
      const t = translations[currentLang];
      document.getElementById('app-content').innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${t.homeTitle}</h1>
          <p class="text-slate-500 text-sm leading-relaxed">${t.homeDesc}</p>
        </div>
        
        <div class="space-y-4">
          <div>
            <input id="cardInput" type="text" placeholder="${t.cardPlaceholder}" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3.5 text-center font-medium uppercase tracking-wider text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
          <button onclick="window.handleCheckCard()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm flex items-center justify-center gap-2">${t.nextBtn}</button>
        </div>
        
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-xs font-medium text-slate-400 uppercase tracking-wider">${t.orText}</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button onclick="window.startQrScanner()" class="w-full bg-white hover:bg-slate-50 active:scale-[0.99] text-slate-700 text-sm font-semibold py-3.5 px-4 rounded-2xl border border-slate-200 shadow-sm transition-all flex items-center justify-center gap-2">${t.scanBtn}</button>

        <div class="mt-6 pt-6 border-t border-slate-100">
          <p class="text-xs font-semibold text-slate-500 mb-2.5">${t.alreadyActiveTitle}</p>
          <button onclick="window.renderManage()" class="w-full bg-slate-100 hover:bg-slate-200/70 active:scale-[0.99] text-slate-700 py-3 px-4 rounded-2xl text-xs font-semibold transition-all flex items-center justify-center gap-2">${t.manageBtn}</button>
        </div>
      `;
    }

    // 2. KARTU AKTIF (Halaman Ringkasan Pemilik Kartu)
    function renderActiveCardStatus(card) {
      const t = translations[currentLang];
      const reviewUrl = formatReviewUrl(card.google_review_url);
      
      const waMessage = encodeURIComponent(`Halo Kak Render, saya ingin bertanya/bantuan terkait kartu dengan Kode Kartu: ${card.card_code}`);
      const waOwnerUrl = `https://wa.me/${OWNER_WHATSAPP}?text=${waMessage}`;

      document.getElementById('app-content').innerHTML = `
        <div class="flex items-center justify-center w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl mb-4 shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        
        <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${t.activeTitle}</h1>
        <p class="text-slate-500 text-xs mb-6 leading-relaxed">
          ${t.activeDesc(card.card_code, card.business_name || 'Business')}
        </p>

        <div class="space-y-3 mb-6">
          <a href="${reviewUrl}" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl text-center shadow-lg shadow-blue-500/25 transition-all text-sm">
            ${t.openReviewBtn}
          </a>

          <button onclick="window.renderManageWithCode('${card.card_code}')" class="w-full bg-slate-100 hover:bg-slate-200/70 active:scale-[0.99] text-slate-700 font-semibold py-3.5 px-4 rounded-2xl text-center transition-all text-sm">
            ${t.editCardBtn}
          </button>
        </div>

        <div class="bg-slate-50/80 p-4 rounded-2xl text-center border border-slate-200/60 flex flex-col gap-3">
          <p class="text-[11px] text-slate-500 leading-normal">${t.saveInfoText}</p>
          
          <button onclick="window.copyPageLink()" class="w-full bg-white hover:bg-slate-50 active:scale-[0.99] text-blue-600 border border-blue-200 text-xs font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
            ${t.copyLinkBtn}
          </button>

          <a href="${waOwnerUrl}" target="_blank" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-white text-xs font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            ${t.contactOwnerBtn}
          </a>
        </div>
      `;
    }

    // 3. KELOLA KARTU
    window.renderManage = function(defaultCode = '') {
      const t = translations[currentLang];
      document.getElementById('app-content').innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${t.manageCardTitle}</h1>
          <p class="text-slate-500 text-sm leading-relaxed">${t.manageCardDesc}</p>
        </div>
        
        <div class="space-y-4 mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.cardCodeLabel}</label>
            <input id="manageCode" type="text" value="${defaultCode}" placeholder="${t.cardCodePlaceholder}" oninput="updateForgotPinLink()" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm uppercase font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
          
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-semibold text-slate-700">${t.pinLabel}</label>
              <a id="forgotPinAnchor" href="#" target="_blank" class="text-xs text-blue-600 font-semibold hover:underline">${t.forgotPinText}</a>
            </div>
            <input id="managePin" type="password" maxlength="4" placeholder="••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm tracking-widest text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
        </div>

        <div class="space-y-2.5">
          <button onclick="window.handleManageLogin()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">${t.openCardBtn}</button>
          <button onclick="window.renderHome()" class="w-full text-slate-500 hover:text-slate-800 text-xs font-semibold py-2.5 transition-all">${t.backBtn}</button>
        </div>
      `;
      updateForgotPinLink();
    }

    window.updateForgotPinLink = function() {
      const codeInput = document.getElementById('manageCode');
      const forgotAnchor = document.getElementById('forgotPinAnchor');
      if (!codeInput || !forgotAnchor) return;

      const codeVal = codeInput.value.trim() || '[Belum diisi]';
      const msg = encodeURIComponent(`Halo Kak Render, saya lupa PIN untuk Kelola Kartu dengan Kode Kartu: ${codeVal}`);
      forgotAnchor.href = `https://wa.me/${OWNER_WHATSAPP}?text=${msg}`;
    }

    window.renderManageWithCode = function(code) { window.renderManage(code); }

    // 4. FORM AKTIVASI (DIKEMAS DENGAN BANTUAN TOOL AMAN 100% GRATIS)
    function renderActivationForm(code) {
      const t = translations[currentLang];
      document.getElementById('app-content').innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${t.activationTitle}</h1>
          <p class="text-slate-500 text-xs leading-relaxed">${t.activationDesc(code)}</p>
        </div>

        <div class="space-y-4 mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.bizNameLabel}</label>
            <input id="bizName" type="text" placeholder="${t.bizNamePlaceholder}" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.bizUrlLabel}</label>
            <input id="bizUrl" type="text" placeholder="ChIJXanaDyrDaC4RTkdVD1FTIyc" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
            
            <!-- BANTUAN CARI PLACE ID & CONVERTER GRATIS -->
            <div class="mt-2 text-[11px] text-slate-500 space-y-1 bg-blue-50/60 p-3 rounded-2xl border border-blue-100">
              <p class="font-semibold text-blue-900 mb-1">💡 Bingung cara dapatkan link ulasan?</p>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                <a href="https://developers.google.com/maps/documentation/javascript/examples/places-placeid-finder" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-medium hover:text-blue-800 transition">
                  🔍 Cari Place ID Toko ↗
                </a>
                <span class="text-slate-300">|</span>
                <a href="https://productmate.com/google-review-link-generator" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-medium hover:text-blue-800 transition">
                  🔗 Convert Link Maps ↗
                </a>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.bizPinLabel}</label>
            <input id="bizPin" type="password" maxlength="4" placeholder="••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm tracking-widest text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
        </div>

        <div class="space-y-2.5">
          <button onclick="window.submitActivation('${code}')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">${t.activateBtn}</button>
          <button onclick="window.renderHome()" class="w-full text-slate-500 hover:text-slate-800 text-xs font-semibold py-2.5 transition-all">${t.backBtn}</button>
        </div>
      `;
    }

    window.handleCheckCard = async function() {
      const code = document.getElementById('cardInput').value.trim().toUpperCase();
      if (!code) {
        showNotification('Notice', currentLang === 'en' ? 'Please enter card code.' : 'Masukkan kode kartu.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .maybeSingle();

      if (error) {
        showNotification('Error', 'Database error.', 'error');
        return;
      }

      if (card) {
        if (card.is_activated) { 
          renderActiveCardStatus(card); 
        } else { 
          renderActivationForm(card.card_code); 
        }
      } else {
        showNotification(
          currentLang === 'en' ? 'Card Not Found' : 'Kartu Tidak Ditemukan', 
          currentLang === 'en' ? `Code "${code}" is not registered in the system.` : `Kode kartu "${code}" tidak terdaftar di sistem. Pastikan kode benar atau gunakan scan QR/NFC pada kartu fisik.`, 
          'error'
        );
      }
    }

    window.submitActivation = async function(code) {
      const name = document.getElementById('bizName').value.trim();
      const rawInput = document.getElementById('bizUrl').value.trim();
      const pin = document.getElementById('bizPin').value.trim();

      if (!name || !rawInput || pin.length !== 4) {
        showNotification('Notice', currentLang === 'en' ? 'Complete all fields & 4-digit PIN.' : 'Lengkapi data & PIN 4 digit.', 'info');
        return;
      }

      const formattedReviewUrl = formatReviewUrl(rawInput);

      const { error } = await supabaseClient
        .from('cards')
        .upsert({ 
          card_code: code,
          business_name: name, 
          google_review_url: formattedReviewUrl, 
          pin: pin, 
          is_activated: true,
          enable_routing: true
        }, { onConflict: 'card_code' });

      if (!error) {
        showNotification('Success!', currentLang === 'en' ? 'Card activated.' : 'Kartu berhasil diaktifkan.', 'success', () => {
          window.renderActiveCardStatusByCode(code);
        });
      } else {
        showNotification('Error', error.message, 'error');
      }
    }

    window.handleManageLogin = async function() {
      const code = document.getElementById('manageCode').value.trim().toUpperCase();
      const pin = document.getElementById('managePin').value.trim();

      if (!code || !pin) {
        showNotification('Notice', currentLang === 'en' ? 'Enter code & PIN.' : 'Masukkan kode & PIN.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .eq('pin', pin)
        .maybeSingle();

      if (card) { renderEditForm(card); } 
      else { showNotification('Access Denied', currentLang === 'en' ? 'Wrong Code or PIN.' : 'Kode atau PIN salah!', 'error'); }
    }

    function renderEditForm(card) {
      const t = translations[currentLang];
      document.getElementById('app-content').innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">${t.editInfoTitle}</h1>
          <p class="text-slate-500 text-xs leading-relaxed">${t.editInfoDesc(card.card_code)}</p>
        </div>

        <div class="space-y-4 mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.bizNameLabel}</label>
            <input id="editName" type="text" value="${card.business_name || ''}" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.bizUrlLabel}</label>
            <input id="editUrl" type="text" value="${card.google_review_url || ''}" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
            
            <!-- BANTUAN DI HALAMAN EDIT -->
            <div class="mt-2 text-[11px] text-slate-500 space-y-1 bg-blue-50/60 p-3 rounded-2xl border border-blue-100">
              <p class="font-semibold text-blue-900 mb-1">💡 Bingung mengubah link ulasan?</p>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                <a href="https://developers.google.com/maps/documentation/javascript/examples/places-placeid-finder" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-medium hover:text-blue-800 transition">
                  🔍 Cari Place ID Toko ↗
                </a>
                <span class="text-slate-300">|</span>
                <a href="https://productmate.com/google-review-link-generator" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-medium hover:text-blue-800 transition">
                  🔗 Convert Link Maps ↗
                </a>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">${t.newPinLabel}</label>
            <input id="editPin" type="password" maxlength="4" placeholder="••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm tracking-widest text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
        </div>

        <div class="space-y-2.5">
          <button onclick="window.submitEdit('${card.card_code}', '${card.pin}')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">${t.saveChangesBtn}</button>
          <button onclick="window.renderActiveCardStatusByCode('${card.card_code}')" class="w-full text-slate-500 hover:text-slate-800 text-xs font-semibold py-2.5 transition-all">${t.cancelBtn}</button>
        </div>
      `;
    }

    window.submitEdit = async function(cardCode, currentPin) {
      const name = document.getElementById('editName').value.trim();
      const rawInput = document.getElementById('editUrl').value.trim();
      const newPin = document.getElementById('editPin').value.trim();

      if (!name || !rawInput) {
        showNotification('Notice', 'Required fields.', 'info');
        return;
      }

      let finalPin = currentPin;
      if (newPin) {
        if (newPin.length !== 4) { showNotification('Notice', 'PIN must be 4 digits.', 'info'); return; }
        finalPin = newPin;
      }

      const formattedReviewUrl = formatReviewUrl(rawInput);
      const { error } = await supabaseClient
        .from('cards')
        .update({ business_name: name, google_review_url: formattedReviewUrl, pin: finalPin })
        .eq('card_code', cardCode);

      if (!error) {
        showNotification('Success', currentLang === 'en' ? 'Data updated successfully.' : 'Data berhasil diperbarui.', 'success', () => {
          window.renderActiveCardStatusByCode(cardCode);
        });
      } else {
        showNotification('Error', error.message, 'error');
      }
    }

    window.renderActiveCardStatusByCode = async function(code) {
      const { data: card } = await supabaseClient.from('cards').select('*').eq('card_code', code).maybeSingle();
      if (card) { renderActiveCardStatus(card); } else { window.renderHome(); }
    }

    initApp();
  </script>
</body>
