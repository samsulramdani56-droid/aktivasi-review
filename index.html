<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Review Google</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Animasi halus untuk pop-up modal */
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal {
      animation: modalFadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

  <!-- Header Website -->
  <header class="w-full max-w-md flex justify-between items-center py-4">
    <div class="flex items-center gap-2">
      <div class="bg-red-700 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center">R</div>
      <span class="font-bold text-gray-800 text-lg">Aktivasi Review</span>
      <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">v4.4</span>
    </div>
    <div class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full flex gap-2">
      <button class="bg-white text-blue-600 px-2 rounded">ID</button>
      <button class="text-white opacity-70">EN</button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main id="app-content" class="w-full max-w-md bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <!-- Diisi otomatis oleh JavaScript -->
  </main>

  <footer class="mt-8 text-center text-xs text-gray-400">
    © 2026 Render Project. Hak cipta dilindungi.
  </footer>

  <!-- MODAL NOTIFIKASI KUSTOM -->
  <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl text-center animate-modal">
      <div id="modal-icon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3"></div>
      <h3 id="modal-title" class="font-bold text-gray-900 text-lg mb-1">Pemberitahuan</h3>
      <p id="modal-message" class="text-sm text-gray-600 mb-6 leading-relaxed"></p>
      <button id="modal-btn" onclick="closeCustomModal()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">
        Mengerti
      </button>
    </div>
  </div>

  <script>
    // ========================================================
    // KUNCI SUPABASE ANDA
    // ========================================================
    const SUPABASE_URL = 'https://lzudrzpcahjyeqdvkyto.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dWRyenBjYWhqeWVxZHZreXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDYyODcsImV4cCI6MjEwNzgyMjI4N30.nI_84CyPRp-sv6_VJvpUB1bk7XWN0NCtSotwztl_lEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const cardCodeParam = urlParams.get('code');

    let modalCallback = null;

    // Helper untuk memastikan URL selalu menggunakan protocol https://
    function formatUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        return 'https://' + cleanUrl;
      }
      return cleanUrl;
    }

    // FUNGSI SALIN LINK KE CLIPBOARD
    function copyPageLink() {
      const currentUrl = window.location.href;
      navigator.clipboard.writeText(currentUrl).then(() => {
        showNotification('Berhasil Disalin!', 'Link halaman ini telah disalin. Simpan tautan ini agar Anda dapat mengedit info kartu kapan saja.', 'success');
      }).catch(err => {
        showNotification('Gagal Menyalin', 'Tidak dapat menyalin tautan secara otomatis.', 'error');
      });
    }

    // FUNGSI NOTIFIKASI KUSTOM
    function showNotification(title, message, type = 'info', onConfirm = null) {
      const modal = document.getElementById('custom-modal');
      const iconEl = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      titleEl.innerText = title;
      msgEl.innerText = message;
      modalCallback = onConfirm;

      if (type === 'success') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-green-100 text-green-600';
        iconEl.innerText = '✓';
      } else if (type === 'error') {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-red-100 text-red-600';
        iconEl.innerText = '✕';
      } else {
        iconEl.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3 bg-blue-100 text-blue-600';
        iconEl.innerText = 'ℹ';
      }

      modal.classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('custom-modal').classList.add('hidden');
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    // INISIALISASI APLIKASI
    async function initApp() {
      if (cardCodeParam) {
        const cleanCode = cardCodeParam.trim().toUpperCase();

        const { data: card, error } = await supabaseClient
          .from('cards')
          .select('*')
          .eq('card_code', cleanCode)
          .maybeSingle();

        if (error) {
          showNotification('Kendala Sistem', 'Gagal terhubung ke database. Silakan coba beberapa saat lagi.', 'error', () => renderHome());
          return;
        }

        if (card) {
          if (card.is_activated) {
            renderActiveCardStatus(card);
            return;
          } else {
            renderActivationForm(card.card_code);
            return;
          }
        } else {
          showNotification('Kartu Tidak Ditemukan', `Kode kartu "${cleanCode}" belum terdaftar di sistem.`, 'error', () => renderHome());
          return;
        }
      }
      
      renderHome();
    }

    // 1. TAMPILAN BERANDA UTAMA
    function renderHome() {
      document.getElementById('app-content').innerHTML = `
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Kartu Review</h1>
        <p class="text-gray-500 text-sm mb-6">
          Hubungkan kartu Anda sekali, lalu pelanggan dapat membuka ulasan Google bisnis Anda hanya dengan menempelkan kartu atau memindai QR.
        </p>
        
        <input id="cardInput" type="text" placeholder="MASUKKAN KODE KARTU" class="w-full border rounded-xl p-3 text-center uppercase tracking-wider mb-3 focus:outline-blue-500 text-sm">
        <button onclick="handleCheckCard()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-4 hover:bg-blue-700 transition">Lanjut →</button>
        
        <div class="relative flex py-2 items-center mb-4">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-xs text-gray-400">atau</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <button onclick="showNotification('Scan QR', 'Gunakan aplikasi kamera bawaan HP Anda untuk memindai QR kartu.', 'info')" class="w-full bg-gray-50 text-gray-700 text-sm py-3 rounded-xl font-medium border mb-4">📷 Scan QR kartu</button>

        <div class="border-t pt-4">
          <p class="text-xs font-semibold text-gray-700 mb-2">Sudah aktivasi kartu?</p>
          <button onclick="renderManage()" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl text-sm font-medium hover:bg-gray-200 transition">⚙️ Kelola kartu Anda di sini.</button>
        </div>
      `;
    }

    // 2. TAMPILAN KARTU AKTIF (Dengan Tombol Salin Link)
    function renderActiveCardStatus(card) {
      const reviewUrl = formatUrl(card.google_review_url);
      document.getElementById('app-content').innerHTML = `
        <div class="flex items-center justify-center w-12 h-12 bg-blue-50 text-blue-600 rounded-full mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        
        <h1 class="text-xl font-bold text-gray-900 mb-2">Kartu aktif!</h1>
        <p class="text-gray-500 text-xs mb-6 leading-relaxed">
          Pengaturan selesai—kartu <span class="font-semibold text-gray-700">${card.card_code}</span> kini membuka halaman ulasan Google untuk <span class="font-bold text-gray-900">${card.business_name || 'Bisnis Anda'}</span>.
        </p>

        <a href="${reviewUrl}" target="_blank" class="block w-full bg-blue-600 text-white font-semibold py-3 rounded-xl text-center mb-3 hover:bg-blue-700 transition">
          Buka halaman review
        </a>

        <button onclick="renderManageWithCode('${card.card_code}')" class="w-full bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl text-center mb-4 hover:bg-gray-200 transition">
          Edit Info Kartu
        </button>

        <div class="bg-gray-50 p-4 rounded-xl text-center border border-gray-100">
          <p class="text-[11px] text-gray-500 leading-normal mb-3">
            Simpan halaman ini bila perlu. PIN yang Anda buat sebelumnya akan diminta saat membuka halaman edit.
          </p>
          <button onclick="copyPageLink()" class="w-full bg-white text-blue-600 border border-blue-200 text-xs font-semibold py-2.5 rounded-lg hover:bg-blue-50 transition flex items-center justify-center gap-1.5 shadow-sm">
            📋 Salin Link Halaman Ini
          </button>
        </div>
      `;
    }

    // 3. TAMPILAN KELOLA / EDIT KARTU
    function renderManage(defaultCode = '') {
      document.getElementById('app-content').innerHTML = `
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Kelola Kartu</h1>
        <p class="text-gray-500 text-sm mb-6">
          Buka data kartu lewat kode unik dan PIN Anda.
        </p>
        
        <label class="block text-xs font-semibold text-gray-700 mb-1">Kode Kartu</label>
        <input id="manageCode" type="text" value="${defaultCode}" placeholder="Contoh: CARD001" class="w-full border rounded-xl p-3 mb-3 text-sm uppercase">
        
        <label class="block text-xs font-semibold text-gray-700 mb-1">PIN (4 Digit Angka)</label>
        <input id="managePin" type="password" maxlength="4" placeholder="****" class="w-full border rounded-xl p-3 mb-4 text-sm">

        <button onclick="handleManageLogin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-3 hover:bg-blue-700 transition">🔓 Buka Kartu</button>
        <button onclick="renderHome()" class="w-full text-gray-600 text-sm py-2">Kembali</button>
      `;
    }

    function renderManageWithCode(code) {
      renderManage(code);
    }

    // 4. TAMPILAN FORM AKTIVASI KARTU
    function renderActivationForm(code) {
      document.getElementById('app-content').innerHTML = `
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Aktivasi Kartu</h1>
        <p class="text-gray-500 text-xs mb-6">
          Anda sedang menyiapkan kartu <span class="font-bold text-black">${code}</span>. Lengkapi detail berikut agar kartu siap digunakan.
        </p>

        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Bisnis</label>
        <input id="bizName" type="text" placeholder="Ketik nama bisnis" class="w-full border rounded-xl p-3 mb-4 text-sm">

        <label class="block text-xs font-semibold text-gray-700 mb-1">Link Google Review</label>
        <input id="bizUrl" type="url" placeholder="https://maps.app.goo.gl/..." class="w-full border rounded-xl p-3 mb-4 text-sm">

        <label class="block text-xs font-semibold text-gray-700 mb-1">Buat PIN (4 Digit Angka)</label>
        <input id="bizPin" type="password" maxlength="4" placeholder="****" class="w-full border rounded-xl p-3 mb-6 text-sm">

        <button onclick="submitActivation('${code}')" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-3 hover:bg-blue-700 transition">Aktifkan Kartu</button>
        <button onclick="renderHome()" class="w-full text-gray-600 text-sm py-2">Kembali</button>
      `;
    }

    // LOGIKA: Tombol Lanjut di Beranda
    async function handleCheckCard() {
      const code = document.getElementById('cardInput').value.trim().toUpperCase();
      if (!code) {
        showNotification('Perhatian', 'Masukkan kode kartu terlebih dahulu.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .maybeSingle();

      if (error) {
        showNotification('Kendala Sistem', 'Gagal memproses data kartu. Pastikan koneksi internet Anda stabil.', 'error');
        return;
      }

      if (card) {
        if (card.is_activated) {
          renderActiveCardStatus(card);
        } else {
          renderActivationForm(card.card_code);
        }
      } else {
        showNotification('Kartu Tidak Ditemukan', `Kode kartu "${code}" tidak ditemukan atau belum terdaftar di sistem.`, 'error');
      }
    }

    // LOGIKA: Simpan Data Aktivasi Ke Supabase
    async function submitActivation(code) {
      const name = document.getElementById('bizName').value.trim();
      const rawUrl = document.getElementById('bizUrl').value.trim();
      const pin = document.getElementById('bizPin').value.trim();

      if (!name || !rawUrl || pin.length !== 4) {
        showNotification('Perhatian', 'Mohon lengkapi semua data dan pastikan PIN berjumlah 4 digit.', 'info');
        return;
      }

      const formattedUrl = formatUrl(rawUrl);

      const { error } = await supabaseClient
        .from('cards')
        .update({
          business_name: name,
          google_review_url: formattedUrl,
          pin: pin,
          is_activated: true
        })
        .eq('card_code', code);

      if (!error) {
        showNotification('Aktivasi Berhasil!', 'Kartu Anda telah aktif.', 'success', () => {
          initApp();
        });
      } else {
        showNotification('Gagal', 'Gagal mengaktifkan kartu: ' + error.message, 'error');
      }
    }

    // LOGIKA: Kelola Kartu (Login)
    async function handleManageLogin() {
      const code = document.getElementById('manageCode').value.trim().toUpperCase();
      const pin = document.getElementById('managePin').value.trim();

      if (!code || !pin) {
        showNotification('Perhatian', 'Masukkan kode kartu dan PIN Anda.', 'info');
        return;
      }

      const { data: card, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .eq('pin', pin)
        .maybeSingle();

      if (card) {
        renderEditForm(card);
      } else {
        showNotification('Akses Ditolak', 'Kode Kartu atau PIN salah!', 'error');
      }
    }

    // FORM EDIT DATA KARTU
    function renderEditForm(card) {
      document.getElementById('app-content').innerHTML = `
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Edit Info Kartu</h1>
        <p class="text-gray-500 text-xs mb-6">
          Memperbarui data untuk kartu <span class="font-bold text-black">${card.card_code}</span>.
        </p>

        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Bisnis</label>
        <input id="editName" type="text" value="${card.business_name || ''}" class="w-full border rounded-xl p-3 mb-4 text-sm">

        <label class="block text-xs font-semibold text-gray-700 mb-1">Link Google Review</label>
        <input id="editUrl" type="url" value="${card.google_review_url || ''}" class="w-full border rounded-xl p-3 mb-4 text-sm">

        <label class="block text-xs font-semibold text-gray-700 mb-1">PIN Baru (Kosongkan jika tidak diganti)</label>
        <input id="editPin" type="password" maxlength="4" placeholder="****" class="w-full border rounded-xl p-3 mb-6 text-sm">

        <button onclick="submitEdit('${card.card_code}', '${card.pin}')" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-3 hover:bg-blue-700 transition">Simpan Perubahan</button>
        <button onclick="renderActiveCardStatusByCode('${card.card_code}')" class="w-full text-gray-600 text-sm py-2">Batal</button>
      `;
    }

    async function submitEdit(code, currentPin) {
      const name = document.getElementById('editName').value.trim();
      const rawUrl = document.getElementById('editUrl').value.trim();
      const newPin = document.getElementById('editPin').value.trim();

      if (!name || !rawUrl) {
        showNotification('Perhatian', 'Nama Bisnis dan Link Review tidak boleh kosong.', 'info');
        return;
      }

      let finalPin = currentPin;
      if (newPin) {
        if (newPin.length !== 4) {
          showNotification('Perhatian', 'PIN baru harus berjumlah 4 digit angka.', 'info');
          return;
        }
        finalPin = newPin;
      }

      const formattedUrl = formatUrl(rawUrl);

      const { error } = await supabaseClient
        .from('cards')
        .update({
          business_name: name,
          google_review_url: formattedUrl,
          pin: finalPin
        })
        .eq('card_code', code);

      if (!error) {
        showNotification('Berhasil', 'Data kartu berhasil diperbarui.', 'success', () => {
          window.location.href = window.location.pathname + '?code=' + code;
        });
      } else {
        showNotification('Gagal', 'Gagal memperbarui kartu: ' + error.message, 'error');
      }
    }

    async function renderActiveCardStatusByCode(code) {
      const { data: card } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_code', code)
        .maybeSingle();

      if (card) {
        renderActiveCardStatus(card);
      } else {
        renderHome();
      }
    }

    initApp();
  </script>
</body>
</html>
