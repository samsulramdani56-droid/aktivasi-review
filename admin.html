<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard - Render Project Card</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal { animation: modalFadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- LOGIN CONTAINER -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-md border border-gray-100">
      <div class="flex items-center gap-2 mb-4 justify-center">
        <div class="bg-red-700 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center">R</div>
        <span class="font-bold text-gray-800 text-lg">Super Admin Panel</span>
      </div>
      <p class="text-xs text-center text-gray-500 mb-6">Masukkan PIN Master Super Admin untuk mengelola seluruh data kartu.</p>
      
      <label class="block text-xs font-semibold text-gray-700 mb-1">PIN Super Admin</label>
      <input id="adminPinInput" type="password" placeholder="****" class="w-full border rounded-xl p-3 mb-4 text-center tracking-widest text-lg focus:outline-blue-500">
      
      <button onclick="handleAdminLogin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition">Masuk Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD CONTAINER (Hidden by Default) -->
  <div id="dashboard-section" class="hidden min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2">
          <div class="bg-red-700 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center">R</div>
          <h1 class="text-2xl font-bold text-gray-900">Dashboard Super Admin</h1>
        </div>
        <p class="text-xs text-gray-500 mt-1">Kelola seluruh kartu review, reset PIN, dan buat kartu baru.</p>
      </div>
      <button onclick="logoutAdmin()" class="bg-gray-200 text-gray-700 text-xs font-semibold px-4 py-2 rounded-xl hover:bg-gray-300 transition">Logout</button>
    </header>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 mb-1">TOTAL KARTU</p>
        <h2 id="statTotal" class="text-3xl font-bold text-gray-900">0</h2>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
        <p class="text-xs font-semibold text-emerald-500 mb-1">KARTU AKTIF</p>
        <h2 id="statActive" class="text-3xl font-bold text-emerald-600">0</h2>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
        <p class="text-xs font-semibold text-amber-500 mb-1">BELUM AKTIF (BLANK)</p>
        <h2 id="statInactive" class="text-3xl font-bold text-amber-600">0</h2>
      </div>
    </div>

    <!-- Action & Table Bar -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-8">
      <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6">
        <input id="searchInput" type="text" oninput="filterCards()" placeholder="Cari Kode Kartu atau Nama Bisnis..." class="border rounded-xl px-4 py-2.5 text-sm w-full md:w-80 focus:outline-blue-500">
        <button onclick="openAddModal()" class="bg-blue-600 text-white font-semibold px-5 py-2.5 rounded-xl text-sm hover:bg-blue-700 transition flex items-center justify-center gap-1.5">
          + Tambah Kartu Baru
        </button>
      </div>

      <!-- Data Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b text-xs text-gray-400 uppercase tracking-wider">
              <th class="pb-3 px-2">Kode Kartu</th>
              <th class="pb-3 px-2">Nama Bisnis</th>
              <th class="pb-3 px-2">Status</th>
              <th class="pb-3 px-2">PIN Klien</th>
              <th class="pb-3 px-2 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="cardsTableBody" class="divide-y divide-gray-100">
            <!-- Diisi otomatis oleh JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT / TAMBAH KARTU -->
  <div id="card-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl animate-modal">
      <h3 id="modalFormTitle" class="font-bold text-gray-900 text-lg mb-4">Tambah Kartu Baru</h3>
      
      <label class="block text-xs font-semibold text-gray-700 mb-1">Kode Kartu (Unik)</label>
      <input id="formCardCode" type="text" placeholder="Isi kode kartu" class="w-full border rounded-xl p-3 mb-3 text-sm uppercase">

      <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Bisnis (Opsional jika belum aktif)</label>
      <input id="formBizName" type="text" placeholder="Opsional" class="w-full border rounded-xl p-3 mb-3 text-sm">

      <label class="block text-xs font-semibold text-gray-700 mb-1">Link Review / Place ID</label>
      <input id="formReviewUrl" type="text" placeholder="opsional" class="w-full border rounded-xl p-3 mb-3 text-sm">

      <label class="block text-xs font-semibold text-gray-700 mb-1">PIN (4 Digit)</label>
      <input id="formPin" type="text" maxlength="4" placeholder="Masukan Pin" class="w-full border rounded-xl p-3 mb-6 text-sm">

      <div class="flex gap-2">
        <button onclick="closeModal()" class="w-1/2 border text-gray-600 font-semibold py-2.5 rounded-xl text-sm">Batal</button>
        <button onclick="saveCardData()" class="w-1/2 bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // KONFIGURASI SUPER ADMIN PIN & SUPABASE
    // ========================================================
    const MASTER_ADMIN_PIN = "1406"; // Ganti dengan PIN Super Admin rahasia Anda

    const SUPABASE_URL = 'https://lzudrzpcahjyeqdvkyto.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dWRyenBjYWhqeWVxZHZreXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDYyODcsImV4cCI6MjEwNzgyMjI4N30.nI_84CyPRp-sv6_VJvpUB1bk7XWN0NCtSotwztl_lEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allCardsData = [];
    let isEditingMode = false;

    function handleAdminLogin() {
      const pin = document.getElementById('adminPinInput').value.trim();
      if (pin === MASTER_ADMIN_PIN) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        fetchCards();
      } else {
        alert("PIN Super Admin Salah!");
      }
    }

    function logoutAdmin() {
      document.getElementById('adminPinInput').value = '';
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    async function fetchCards() {
      const { data: cards, error } = await supabaseClient.from('cards').select('*').order('card_code', { ascending: true });
      if (!error && cards) {
        allCardsData = cards;
        updateStats();
        renderTable(allCardsData);
      }
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = allCardsData.length;
      const activeCount = allCardsData.filter(c => c.is_activated).length;
      document.getElementById('statActive').innerText = activeCount;
      document.getElementById('statInactive').innerText = allCardsData.length - activeCount;
    }

    function renderTable(data) {
      const tbody = document.getElementById('cardsTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-400">Belum ada data kartu.</td></tr>`;
        return;
      }

      data.forEach(card => {
        const badge = card.is_activated 
          ? `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-[11px] font-semibold">Aktif</span>`
          : `<span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full text-[11px] font-semibold">Belum Aktif</span>`;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3.5 px-2 font-bold text-gray-900">${card.card_code}</td>
            <td class="py-3.5 px-2 font-medium text-gray-700">${card.business_name || '-'}</td>
            <td class="py-3.5 px-2">${badge}</td>
            <td class="py-3.5 px-2 font-mono text-xs bg-slate-100 px-2 rounded text-gray-600">${card.pin || '-'}</td>
            <td class="py-3.5 px-2 text-right">
              <button onclick="openEditModal('${card.card_code}')" class="text-xs bg-blue-50 text-blue-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-100 transition mr-1">Edit</button>
              <button onclick="deleteCard('${card.card_code}')" class="text-xs bg-red-50 text-red-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-red-100 transition">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allCardsData.filter(c => 
        c.card_code.toLowerCase().includes(q) || 
        (c.business_name && c.business_name.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function openAddModal() {
      isEditingMode = false;
      document.getElementById('modalFormTitle').innerText = "Tambah Kartu Baru";
      document.getElementById('formCardCode').value = '';
      document.getElementById('formCardCode').disabled = false;
      document.getElementById('formBizName').value = '';
      document.getElementById('formReviewUrl').value = '';
      document.getElementById('formPin').value = '1234';
      document.getElementById('card-modal').classList.remove('hidden');
    }

    function openEditModal(code) {
      isEditingMode = true;
      const card = allCardsData.find(c => c.card_code === code);
      if (!card) return;

      document.getElementById('modalFormTitle').innerText = `Edit Kartu (${code})`;
      document.getElementById('formCardCode').value = card.card_code;
      document.getElementById('formCardCode').disabled = true;
      document.getElementById('formBizName').value = card.business_name || '';
      document.getElementById('formReviewUrl').value = card.google_review_url || '';
      document.getElementById('formPin').value = card.pin || '';
      document.getElementById('card-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }

    function formatReviewUrl(input) {
      if (!input) return '';
      let clean = input.trim();
      if (clean.startsWith('ChI') && !clean.includes('http')) {
        return `https://search.google.com/local/writereview?placeid=${clean}`;
      }
      if (!clean.startsWith('http://') && !clean.startsWith('https://')) {
        return 'https://' + clean;
      }
      return clean;
    }

    async function saveCardData() {
      const code = document.getElementById('formCardCode').value.trim().toUpperCase();
      const name = document.getElementById('formBizName').value.trim();
      const urlInput = document.getElementById('formReviewUrl').value.trim();
      const pin = document.getElementById('formPin').value.trim();

      if (!code) { alert("Kode kartu wajib diisi!"); return; }

      const formattedUrl = formatReviewUrl(urlInput);
      const isActivated = name.length > 0 || formattedUrl.length > 0;

      const payload = {
        card_code: code,
        business_name: name || null,
        google_review_url: formattedUrl || null,
        pin: pin || '1234',
        is_activated: isActivated
      };

      const { error } = await supabaseClient.from('cards').upsert(payload, { onConflict: 'card_code' });

      if (!error) {
        closeModal();
        fetchCards();
      } else {
        alert("Gagal menyimpan data: " + error.message);
      }
    }

    async function deleteCard(code) {
      if (confirm(`Apakah Anda yakin ingin menghapus kartu ${code}?`)) {
        const { error } = await supabaseClient.from('cards').delete().eq('card_code', code);
        if (!error) {
          fetchCards();
        } else {
          alert("Gagal menghapus kartu: " + error.message);
        }
      }
    }
  </script>
</body>
</html>
